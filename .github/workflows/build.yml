name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS-universal
          - os: windows-2022
            name: Windows-x64
          - os: ubuntu-22.04
            name: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile Metal kernels offline (syntax check)
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx metal -c src/metal/kernels.metal -o "$RUNNER_TEMP/kernels.air"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -V

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build/Seperator.ofx.bundle
          lipo -info build/Seperator.ofx.bundle/Contents/MacOS/Seperator.ofx

      - name: Package
        shell: bash
        run: |
          cd build
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../Seperator-${{ matrix.name }}.zip Seperator.ofx.bundle
          else
            zip -qry ../Seperator-${{ matrix.name }}.zip Seperator.ofx.bundle
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Seperator-${{ matrix.name }}
          path: Seperator-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
